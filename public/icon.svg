<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Document Sheet with Folded Corner -->
  <g filter="url(#shadow)">
    <path d="M 140 100 L 310 100 L 372 162 L 372 412 L 140 412 Z" fill="#ffffff" rx="8"/>
    <path d="M 310 100 L 310 162 L 372 162 Z" fill="#e2e8f0"/>
  </g>

  <!-- Document Lines -->
  <rect x="176" y="160" width="105" height="14" rx="7" fill="#2563eb"/>
  <rect x="176" y="200" width="160" height="10" rx="5" fill="#94a3b8"/>
  <rect x="176" y="226" width="160" height="10" rx="5" fill="#94a3b8"/>
  <rect x="176" y="252" width="120" height="10" rx="5" fill="#94a3b8"/>
  
  <!-- Government / Security Seal Badge -->
  <circle cx="305" cy="345" r="46" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="305" cy="345" r="38" fill="none" stroke="#854d0e" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 292 345 L 301 354 L 320 334" fill="none" stroke="#713f12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Official Emblem Text Banner -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="28" fill="#e0f2fe" letter-spacing="3">AUTO CONTRACT</text>
</svg>
